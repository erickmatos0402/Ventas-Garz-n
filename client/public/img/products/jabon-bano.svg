<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Jabón de baño">
  <defs>
    <linearGradient id="jbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F7EE"/>
      <stop offset="1" stop-color="#CBE9D8"/>
    </linearGradient>
    <linearGradient id="jbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3BB578"/>
      <stop offset="1" stop-color="#12945A"/>
    </linearGradient>
  </defs>
  <rect width="320" height="320" rx="36" fill="url(#jbBg)"/>
  <!-- espuma -->
  <circle cx="86" cy="96" r="26" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="122" cy="82" r="18" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="66" cy="128" r="16" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="238" cy="210" r="20" fill="#FFFFFF" opacity="0.5"/>
  <!-- jabonera -->
  <ellipse cx="160" cy="238" rx="104" ry="20" fill="#0E8C4F" opacity="0.28"/>
  <ellipse cx="160" cy="232" rx="96" ry="16" fill="#FFFFFF" opacity="0.7"/>
  <!-- pastilla de jabón -->
  <rect x="84" y="128" width="152" height="84" rx="30" fill="url(#jbBody)"/>
  <rect x="84" y="128" width="152" height="34" rx="17" fill="#FFFFFF" opacity="0.22"/>
  <!-- sello -->
  <circle cx="160" cy="170" r="22" fill="#FFFFFF" opacity="0.9"/>
  <path d="M150 170 l7 8 l14 -16" fill="none" stroke="#10A55E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- burbujas -->
  <circle cx="250" cy="88" r="12" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="272" cy="118" r="7" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="46" cy="200" r="9" fill="#FFFFFF" opacity="0.5"/>
</svg>
